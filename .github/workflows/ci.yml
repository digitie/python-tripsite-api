name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium
      # tests/e2e also holds the live-site tests; they skip themselves without site credentials,
      # which CI never has. The MCP stdio test there needs no credentials and does run.
      - name: Run tests
        run: pytest tests/unit tests/e2e -v
