[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripsite-api"
version = "0.1.0"
description = "Playwright-based reservation lookup for Yanolja, Yeogiotae (Goodchoice), and Naver Booking, exposed as an MCP server."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    # 1.19 is the first release whose FastMCP passes a returned CallToolResult through
    # unchanged, which the error reporting in mcp_server.py depends on. Verified on 1.19.0
    # with pydantic<2.14; that mcp imports a pydantic helper removed in 2.14, so a
    # lowest-version install with the newest pydantic fails loudly at import. Capped below
    # 2 because the FastMCP API was renamed (to MCPServer) in 2.x.
    "mcp>=1.19,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
tripsite = "tripsite_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tripsite_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
