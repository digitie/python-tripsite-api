[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripsite-api"
version = "0.1.0"
description = "Playwright-based reservation lookup for Yanolja, Yeogiotae (Goodchoice), and Naver Booking, exposed as an MCP server."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tripsite_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
